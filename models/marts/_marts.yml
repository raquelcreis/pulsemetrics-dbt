
version: 2

models:
  - name: mart_monthly_revenue
    description: >
      Monthly revenue metrics for the PulseMetrics SaaS business.
      One row per completed month, measured at month end, with active
      customers, active subscriptions, contracted MRR, and ARPA.
    config:
      contract:
        enforced: true

    columns:
      - name: month_start
        data_type: date
        constraints:
          - type: not_null
        description: First day of the reporting month.
        tests:
          - not_null
          - unique

      - name: active_customers
        data_type: number(18,0)
        constraints:
          - type: not_null
        description: Distinct customers with at least one active subscription at month end.
        tests:
          - not_null

      - name: active_subscriptions
        data_type: number(30,0)
        constraints:
          - type: not_null
        description: Subscriptions active at month end.
        tests:
          - not_null

      - name: contracted_mrr
        data_type: number(38,2)
        constraints:
          - type: not_null
        description: Month-end contracted run rate from monthly plans, in USD; not prorated or payment-derived.
        tests:
          - not_null

      - name: arpa
        data_type: number(38,8)
        constraints:
          - type: not_null
        description: Month-end contracted MRR divided by month-end active customers, in USD.
        tests:
          - not_null


  - name: mart_monthly_churn
    description: >
      Completed-month estimated customer churn metrics based on subscription
      lifecycle dates. Churn is inferred, not directly observed. The rate is
      churned opening-base customers divided by customers active immediately
      before the month began.
    config:
      contract:
        enforced: true

    columns:
      - name: month_start
        data_type: date
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - unique

      - name: opening_active_customers
        data_type: number(18,0)
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: churned_customers
        data_type: number(18,0)
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: customer_churn_rate
        data_type: float
        constraints:
          - type: not_null
        data_tests:
          - not_null
